<style>

:root{

html,body{height:100%}

  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px;box-sizing:border-box;min-height:100%}

header{text-align:center}

.sub{color:var(--suave);font-size:.9rem;margin-top:4px}
.mesa{position:relative;width:100%;height:540px;perspective:1200px}
.deck{position:absolute;width:104px;height:150px;cursor:pointer;border:0;background:none;padding:0;top:356px;transition:opacity .3s;color:inherit;font:inherit}
#deck{left:calc(50% - 124px)}
#lixo{left:calc(50% + 20px)}
.deck .lbl{position:absolute;top:162px;left:-10px;right:-10px;text-align:center;font-size:.75rem;color:var(--suave);letter-spacing:.06em}
#lixo .vaga{position:absolute;inset:0;border-radius:12px;border:2px dashed var(--linha)}
#lixo .mini{position:absolute;inset:0;transition:transform .2s;border-radius:12px;background:var(--carta);color:var(--tinta);border:2px solid var(--cor,var(--l1));font-family:var(--display);font-size:.62rem;line-height:1.3;padding:12px 9px;text-align:center;display:grid;place-items:center;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.35)}
#lixo:focus-visible{outline:2px solid var(--ouro);outline-offset:8px;border-radius:12px}
.float{animation:flutua 4s ease-in-out infinite;width:100%;height:100%;position:relative;transform-style:preserve-3d}
@keyframes flutua{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-10px) rotate(.6deg)}}
.seg{display:inline-flex;border:1px solid var(--linha);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-size:.85rem;border:0;background:transparent;color:var(--suave);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ouro);color:var(--tinta);font-weight:600}
.ver{position:fixed;inset:0;z-index:20;background:rgba(20,6,13,.88);backdrop-filter:blur(6px);display:flex;flex-direction:column;justify-content:center;gap:18px;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.ver .cab{display:flex;justify-content:space-between;align-items:center;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));color:var(--ouro);font-family:var(--display);font-size:1.2rem}
.trilho{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:20px calc(50% - 120px);scrollbar-width:none}
.trilho::-webkit-scrollbar{display:none}
.trilho .face{position:relative;flex:0 0 240px;height:330px;scroll-snap-align:center;animation:flutua 4s ease-in-out infinite}
.trilho .face:nth-child(even){animation-delay:-2s}
.ver .rodape{text-align:center;color:var(--suave);font-size:.85rem;font-variant-numeric:tabular-nums}
.deck .verso{position:absolute;inset:0;border-radius:14px;background:
  repeating-linear-gradient(45deg,transparent 0 9px,rgba(224,180,92,.18) 9px 10px),
  repeating-linear-gradient(-45deg,transparent 0 9px,rgba(224,180,92,.18) 9px 10px),#5a1d38;

.deck .verso:nth-child(1){transform:translate(6px,6px)}
.deck .verso:nth-child(2){transform:translate(3px,3px)}
.deck .verso:nth-child(3)::after{content:"♥";position:absolute;inset:0;display:grid;place-items:center;font-size:2.6rem;color:var(--ouro);font-family:var(--display)}
.deck:hover .verso:nth-child(3){transform:translateY(-4px)}
.deck:focus-visible{outline:2px solid var(--ouro);outline-offset:8px;border-radius:14px}
.deck.vazio{opacity:.25;cursor:default}
.dica{position:absolute;top:140px;width:100%;text-align:center;color:var(--suave);font-size:.95rem;font-family:var(--display)}
.carta{position:absolute;width:240px;height:330px;left:calc(50% - 120px);top:6px;cursor:pointer;transform-style:preserve-3d}
.costas{position:absolute;inset:0;border-radius:18px;transform:rotateY(180deg);backface-visibility:hidden;border:2px solid var(--ouro);background:repeating-linear-gradient(45deg,transparent 0 9px,rgba(224,180,92,.18) 9px 10px),repeating-linear-gradient(-45deg,transparent 0 9px,rgba(224,180,92,.18) 9px 10px),#5a1d38}

.face .pe{background:var(--cor);color:#fff;text-align:center;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;padding:9px;font-weight:600}
.pontos{display:inline-flex;gap:4px}.pontos i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.25}.pontos i.a{opacity:1}
.acoes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button.b{font:inherit;font-weight:500;border-radius:999px;padding:10px 18px;border:1px solid var(--linha);background:rgba(255,255,255,.05);color:var(--carta);cursor:pointer}
button.b.pri{background:var(--ouro);color:var(--tinta);border-color:var(--ouro)}
button.b:focus-visible,.chip:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
.contador{font-variant-numeric:tabular-nums;color:var(--suave);font-size:.85rem}
details{width:100%;border:1px solid var(--linha);border-radius:16px;background:rgba(0,0,0,.18)}
summary{cursor:pointer;padding:14px 18px;font-weight:600;color:var(--ouro);list-style:none;display:flex;justify-content:space-between}
summary::after{content:"＋"}details[open] summary::after{content:"－"}
.filtros{padding:0 18px 18px;display:flex;flex-direction:column;gap:16px}
.rot{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.88rem;border-radius:999px;padding:7px 13px;border:1px solid var(--linha);background:transparent;color:var(--suave);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c,var(--ouro));border-color:var(--c,var(--ouro));color:#fff}
.chip.t[aria-pressed="true"]{color:var(--tinta)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <div class="mesa">

    </div><div class="costas"></div></div></div>
  </div>

  <div class="acoes">
    <button class="b pri" id="prox">Puxar carta</button>
    <button class="b" id="emb">Embaralhar de novo</button>
  </div>
  <div class="seg" role="group" aria-label="Ordem das cartas">
    <button id="oAle" aria-pressed="true">Aleatório</button>
    <button id="oProf" aria-pressed="false">Do leve ao profundo</button>
  </div>
  <div class="contador" id="cont"></div>

  <details id="det">

    <div class="filtros">

</div>

<div class="ver" id="ver" hidden>

  <div class="rodape">Deslize para o lado para passar as cartas</div>
</div>

Object.entries(TEM).forEach(([k,l])=>chip($("temas"),l,selT.has(k),"t",null,b=>{
  if(selT.has(k)){if(selT.size===1)return;selT.delete(k)}else selT.add(k);
  b.setAttribute("aria-pressed",selT.has(k));save("t2",[...selT]);embaralhar()}));

let ordem=load("o","ale"), atual=null, foram=[], ocupado=false;
const calmo=matchMedia("(prefers-reduced-motion: reduce)").matches;
function embaralhar(){
  pilha=P.filter(p=>selN.has(p[1])&&selT.has(p[2]));
  for(let i=pilha.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[pilha[i],pilha[j]]=[pilha[j],pilha[i]]}
  if(ordem==="prof")pilha.sort((a,b)=>b[1]-a[1]); // pop() tira do fim: leves primeiro
  total=pilha.length;tiradas=0;atual=null;foram=[];$("carta").hidden=true;$("pilhaLixo").innerHTML="";atualiza();
}
function atualiza(){
  save("jogo",{pilha,foram,atual,tiradas,total});
  $("cont").textContent=total?`${tiradas} de ${total} cartas puxadas`:"Nenhuma pergunta com esses filtros";
  $("deck").classList.toggle("vazio",!pilha.length);
  $("lblDeck").textContent=`Baralho · ${pilha.length}`;
  $("lblLixo").textContent=`Já foram · ${foram.length}`;
  $("dica").textContent=pilha.length?"Toque no baralho para puxar uma carta":"Fim do baralho. Embaralhe de novo.";
  $("dica").hidden=!!atual;
  $("prox").textContent=atual?"Guardar carta":"Puxar carta";
  $("prox").disabled=!atual&&!pilha.length;
}
function aoAcaso(){return {r:(Math.random()*14-7).toFixed(1),x:(Math.random()*10-5)|0,y:(Math.random()*8-4)|0}}
function poeNoMonte(c,p){
  const m=document.createElement("span");m.className="mini";m.textContent=c[0];
  m.style.setProperty("--cor",`var(${NIV[c[1]][1]})`);
  m.style.transform=`translate(${p.x}px,${p.y}px) rotate(${p.r}deg)`;
  const box=$("pilhaLixo");box.appendChild(m);
  while(box.children.length>7)box.firstChild.remove();
}
function delta(alvo,p){p=p||{x:0,y:0};
  const c=$("carta").getBoundingClientRect(),a=alvo.getBoundingClientRect();
  return `translate(${a.left+a.width/2-c.left-c.width/2+p.x}px,${a.top+a.height/2-c.top-c.height/2+p.y}px) scale(${a.width/c.width})`;
}
function puxar(){
  if(ocupado||!pilha.length)return;
  atual=pilha.pop();tiradas++;
  const [t,n,k]=atual,c=$("carta");
  $("face").style.setProperty("--cor",`var(${NIV[n][1]})`);
  $("q").textContent=t;$("tema").textContent=TEM[k];$("nivel").textContent=NIV[n][0];
  [...$("pontos").children].forEach((i,x)=>i.classList.toggle("a",x<n));
  c.hidden=false;atualiza();
  if(calmo)return;
  ocupado=true;
  c.animate([{transform:delta($("deck"))+" rotateY(180deg)"},{transform:"none"}],{duration:750,easing:"cubic-bezier(.2,.8,.2,1)"}).onfinish=()=>ocupado=false;
}
function guardar(){
  if(ocupado||!atual)return;
  const c=$("carta"),p=aoAcaso(),fim=()=>{c.hidden=true;poeNoMonte(atual,p);foram.push(atual);atual=null;ocupado=false;atualiza()};
  if(calmo)return fim();
  ocupado=true;
  c.animate([{transform:"none"},{transform:delta($("lixo"),p)+` rotate(${p.r}deg)`}],{duration:550,easing:"cubic-bezier(.5,0,.3,1)",fill:"forwards"}).onfinish=a=>{fim();c.getAnimations().forEach(x=>x.cancel())};
}
function clique(){atual?guardar():puxar()}
function verForam(){
  if(!foram.length&&!atual)return;
  const lista=atual?[...foram,atual]:foram,tr=$("trilho");tr.innerHTML="";
  lista.forEach(([t,n,k])=>{
    const f=document.createElement("div");f.className="face";f.style.setProperty("--cor",`var(${NIV[n][1]})`);
    f.innerHTML=`<div class="topo"><span></span><span class="pontos">${[1,2,3].map(x=>`<i class="${x<=n?"a":""}"></i>`).join("")}</span></div><div class="q"></div><div class="pe"></div>`;
    f.querySelector(".topo span").textContent=TEM[k];f.querySelector(".q").textContent=t;f.querySelector(".pe").textContent=NIV[n][0];
    tr.appendChild(f);
  });
  $("ver").hidden=false;tr.scrollLeft=0;$("fechar").focus();
}
function setOrdem(o){ordem=o;save("o",o);$("oAle").setAttribute("aria-pressed",o==="ale");$("oProf").setAttribute("aria-pressed",o==="prof");embaralhar()}
$("deck").onclick=()=>{if(!atual)puxar()};
$("carta").onclick=clique;$("prox").onclick=clique;$("emb").onclick=embaralhar;
$("lixo").onclick=verForam;$("fechar").onclick=()=>$("ver").hidden=true;
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("ver").hidden=true});
$("oAle").onclick=()=>setOrdem("ale");$("oProf").onclick=()=>setOrdem("prof");
(function(){
  $("oAle").setAttribute("aria-pressed",ordem==="ale");$("oProf").setAttribute("aria-pressed",ordem==="prof");
  const j=load("jogo",null);
  if(!j||!Array.isArray(j.pilha)){embaralhar();return}
  pilha=j.pilha;foram=j.foram||[];tiradas=j.tiradas||0;total=j.total||0;atual=null;
  foram.slice(-7).forEach(c=>poeNoMonte(c,aoAcaso()));
  if(j.atual){pilha.push(j.atual);tiradas--;atualiza();puxar()}else atualiza();
})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
